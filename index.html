<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Claude Opus 4.5 - Puter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; }
        button { margin-top: 10px; padding: 8px 16px; }
        pre { white-space: pre-wrap; margin-top: 20px; }
    </style>
</head>
<body>

<h2>Claude Opus 4.5</h2>

<textarea id="prompt" placeholder="Digite sua pergunta aqui..."></textarea>
<br>
<button onclick="enviar()">Enviar</button>

<pre id="output"></pre>

<script src="https://js.puter.com/v2/"></script>

<script>
async function enviar() {
    const prompt = document.getElementById("prompt").value.trim();
    const output = document.getElementById("output");

    if (!prompt) {
        output.innerText = "Digite alguma coisa.";
        return;
    }

    output.innerText = "Gerando resposta...";

    try {
        const response = await puter.ai.chat(
            prompt,
            { model: "claude-opus-4-5" }
        );

        output.innerText = response.message.content[0].text;
    } catch (err) {
        console.error(err);
        output.innerText = "Erro ao gerar resposta.";
    }
}
</script>

</body>
</html>
